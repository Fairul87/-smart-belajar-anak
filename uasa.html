<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Belajar UASA Darjah 1</title>
<style>
body{font-family:Arial;background:#eef4ff;margin:0;padding:20px}
.box{max-width:600px;margin:auto;background:white;padding:20px;border-radius:20px}
button{width:100%;padding:15px;margin:7px 0;border:0;border-radius:12px;background:#2563eb;color:white;font-size:17px}
h1{text-align:center}
#quiz,#result{display:none}
</style>
</head>
<body>

<div class="box" id="home">
<h1>📚 Smart Belajar</h1>
<p>Latihan UASA Darjah 1</p>
<button onclick="mula()">🧮 Matematik</button>
<button onclick="mula()">📖 Bahasa Melayu</button>
<button onclick="mula()">🇬🇧 English</button>
<button onclick="mula()">🔬 Sains</button>
<button onclick="mula()">🕌 Pendidikan Islam</button>
<button onclick="mula()">✍️ Jawi</button>
</div>

<div class="box" id="quiz">
<h2 id="soalan"></h2>
<div id="jawapan"></div>
<p id="markah"></p>
</div>

<div class="box" id="result">
<h1>🎉 Tahniah!</h1>
<h2 id="skor"></h2>
<button onclick="location.reload()">🔄 Main Lagi</button>
</div>

<script>
let i=0,score=0;
let q=[
["3 + 4 = ?",["5","6","7","8"],2],
["9 - 5 = ?",["3","4","5","6"],1],
["2 + 6 = ?",["6","7","8","9"],2],
["5 + 5 = ?",["8","9","10","11"],2],
["10 - 3 = ?",["5","6","7","8"],2]
];

function mula(){
document.getElementById("home").style.display="none";
document.getElementById("quiz").style.display="block";
papar();
}

function papar(){
document.getElementById("soalan").innerText="Soalan "+(i+1)+" / "+q.length+"\n"+q[i][0];
let x=document.getElementById("jawapan");
x.innerHTML="";
q[i][1].forEach((a,n)=>{
let b=document.createElement("button");
b.innerText=a;
b.onclick=()=>jawab(n);
x.appendChild(b);
});
}

function jawab(n){
if(n==q[i][2])score++;
i++;
if(i<q.length)papar();
else{
document.getElementById("quiz").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("skor").innerText="Skor: "+score+" / "+q.length;
}
}
</script>

</body>
</html>
