<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Belajar Anak - Tahun 1 V2</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dbeafe,#fef3c7);min-height:100vh;color:#172033}.app{max-width:540px;margin:auto;padding:18px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 30px #0002;margin-top:18px}h1{text-align:center;margin:4px 0 8px;font-size:28px}.sub{text-align:center;color:#64748b;margin-bottom:18px}input{width:100%;padding:14px;border:2px solid #dbeafe;border-radius:14px;font-size:17px}button{width:100%;border:0;border-radius:15px;padding:14px;margin-top:10px;font-size:17px;font-weight:700}.start{background:#2563eb;color:white}.opt{background:#f1f5f9}.correct{background:#bbf7d0!important}.wrong{background:#fecaca!important}.top{display:flex;justify-content:space-between;font-weight:700;color:#475569}.stats{text-align:center;margin:10px 0;font-size:18px}.progress{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:12px 0 20px}.bar{height:100%;background:#2563eb;width:0;transition:.3s}.q{font-size:38px;font-weight:900;text-align:center;margin:24px 0}.feedback{text-align:center;font-weight:700;min-height:28px;margin-top:12px}.hidden{display:none}.result{text-align:center}.score{font-size:58px;font-weight:900;color:#2563eb}.stars{font-size:34px;margin:8px}.small{text-align:center;color:#64748b;font-size:14px}.badge{display:inline-block;padding:7px 12px;border-radius:20px;background:#fef3c7;font-weight:700;margin:5px}</style></head><body><div class="app">
<section id="home" class="card"><h1>📚 Smart Belajar Anak</h1><div class="sub">Matematik Tahun 1 • V2</div><input id="name" placeholder="Nama murid"><div style="text-align:center;margin:14px 0"><span class="badge">⭐ Level 1</span><span class="badge">🎯 20 Soalan</span></div><button class="start" onclick="startQuiz()">🚀 Mula Belajar</button><p class="small">Tambah • Tolak • Soalan rawak • Markah & bintang</p></section>
<section id="quiz" class="card hidden"><div class="top"><span id="student"></span><span id="counter"></span></div><div class="stats">⭐ <span id="stars">0</span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="question" class="q"></div><div id="answers"></div><div id="feedback" class="feedback"></div></section>
<section id="result" class="card result hidden"><h1>🎉 Tahniah!</h1><p id="resultName"></p><div id="score" class="score"></div><div id="resultStars" class="stars"></div><p id="message"></p><button class="start" onclick="startQuiz()">🔄 Main Semula</button><button class="opt" onclick="goHome()">🏠 Menu Utama</button></section></div>
<script>
let questions=[],current=0,score=0,locked=false;
function rand(n){return Math.floor(Math.random()*n)+1}
function makeQuestions(){const list=[];for(let i=0;i<20;i++){let a,b,ans,op;if(Math.random()<.55){a=rand(20);b=rand(20);ans=a+b;op="+"}else{a=rand(20);b=rand(a);ans=a-b;op="-"}let set=new Set([ans]);while(set.size<4){let x=ans+Math.floor(Math.random()*9)-4;if(x>=0&&x<=40)set.add(x)}list.push({text:a+" "+op+" "+b+" = ?",ans,opts:[...set].sort(()=>Math.random()-.5)})}return list}
function startQuiz(){questions=makeQuestions();current=0;score=0;document.getElementById("home").classList.add("hidden");document.getElementById("result").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");document.getElementById("student").textContent="👦 "+(document.getElementById("name").value.trim()||"Murid");showQuestion()}
function showQuestion(){locked=false;let q=questions[current];document.getElementById("counter").textContent=(current+1)+"/20";document.getElementById("stars").textContent=score;document.getElementById("bar").style.width=(current/20*100)+"%";document.getElementById("question").textContent=q.text;document.getElementById("feedback").textContent="";let box=document.getElementById("answers");box.innerHTML="";q.opts.forEach(x=>{let b=document.createElement("button");b.className="opt";b.textContent=x;b.onclick=()=>answer(x,b);box.appendChild(b)})}
function answer(x,btn){if(locked)return;locked=true;let q=questions[current];if(x===q.ans){score++;btn.classList.add("correct");document.getElementById("feedback").textContent="✅ Betul! Hebat! ⭐"}else{btn.classList.add("wrong");document.getElementById("feedback").textContent="❌ Belum tepat. Jawapan: "+q.ans;[...document.querySelectorAll(".opt")].forEach(b=>{if(Number(b.textContent)===q.ans)b.classList.add("correct")})}setTimeout(()=>{current++;current<20?showQuestion():finish()},700)}
function finish(){document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.remove("hidden");let n=document.getElementById("name").value.trim()||"Murid";document.getElementById("resultName").textContent="Syabas, "+n+"!";document.getElementById("score").textContent=score+" / 20";let s=score>=18?5:score>=15?4:score>=11?3:score>=6?2:1;document.getElementById("resultStars").textContent="⭐".repeat(s);document.getElementById("message").textContent=score===20?"🏆 Master! Semua betul!":score>=16?"🌟 Cemerlang! Teruskan!":score>=11?"👍 Bagus! Cuba lagi untuk capai lebih tinggi!":"💪 Terus berlatih. Kamu boleh!"}
function goHome(){document.getElementById("result").classList.add("hidden");document.getElementById("home").classList.remove("hidden")}
</script></body></html>
